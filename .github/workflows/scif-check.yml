name: SCIF Typecheck & Compile

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  scif:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      # Pinned prebuilt JAR from the `latest` release.
      SCIF_JAR_URL: https://github.com/apl-cornell/SCIF/releases/download/latest/SCIF-full-0.5.0.jar
      SCIF_JAR: /tmp/scif.jar

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Download prebuilt SCIF JAR
        run: |
          curl -fsSL -o "$SCIF_JAR" "$SCIF_JAR_URL"
          java -jar "$SCIF_JAR" --help 2>&1 | head -20 || true

      - name: Typecheck all .scif files
        run: |
          set +e
          failed=0
          # Exclude hidden dirs (SCIF creates .scif/ at runtime), tmp/, third_party/
          for f in $(find . -name '*.scif' -not -path '*/.*' -not -path './tmp/*' -not -path './third_party/*'); do
            echo "::group::Typechecking $f"
            if java -jar "$SCIF_JAR" -t "$f" 2>&1; then
              echo "OK: $f"
            else
              echo "::error file=$f::SCIF typecheck failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          if [ "$failed" -eq 1 ]; then
            echo "::error::One or more SCIF files failed typechecking"
            exit 1
          fi

      - name: Compile .scif files to Solidity (best-effort)
        if: success()
        run: |
          mkdir -p tmp
          compiled=0
          skipped=0
          for f in $(find . -name '*.scif' -not -path '*/.*' -not -path './tmp/*' -not -path './third_party/*'); do
            echo "::group::Compiling $f"
            outfile="tmp/$(basename "$f" .scif).sol"
            if java -jar "$SCIF_JAR" -c "$f" -o "$outfile" 2>&1 && [ -f "$outfile" ]; then
              echo "OK: $f -> $outfile"
              compiled=$((compiled + 1))
            else
              echo "::warning file=$f::SCIF codegen skipped (v0.5.0 may not support all constructs)"
              skipped=$((skipped + 1))
            fi
            echo "::endgroup::"
          done
          echo "Compiled: $compiled, Skipped: $skipped"

      - name: Upload compiled Solidity
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiled-solidity
          path: tmp/*.sol
          retention-days: 7
          if-no-files-found: ignore
